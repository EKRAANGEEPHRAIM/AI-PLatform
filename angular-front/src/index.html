<!doctype html>
<html lang="fr" class="light">
<head>
  <meta charset="utf-8">
  <title>Akwaba — votre boutique répond, même quand elle est fermée</title>
  <meta name="description" content="Un assistant de service client pour les petites entreprises : il répond aux clients sur votre site, jour et nuit, uniquement à partir de ce que vous lui avez écrit (prix, horaires, livraison).">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#1f5135">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Caveat:wght@600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Thème appliqué avant le premier affichage. Clair par défaut : le sombre est un choix explicite.
    (function () {
      try {
        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.remove('light');
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
